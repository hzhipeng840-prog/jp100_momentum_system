name: JP100 daily pipeline

on:
  schedule:
    - cron: "17 19 * * 1-5"
      timezone: "Asia/Tokyo"
    - cron: "47 21 * * 1-5"
      timezone: "Asia/Tokyo"
  workflow_dispatch:
    inputs:
      force:
        description: "同じ基準日・同じ版でも再実行する"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: jp100-daily-pipeline
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore published histories
        shell: bash
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --heads origin data >/dev/null 2>&1; then
            git fetch origin data:refs/remotes/origin/data
            git archive \
              --format=tar \
              --output="$RUNNER_TEMP/jp100-data.tar" \
              origin/data \
              data/history \
              data/processed
            tar -xf "$RUNNER_TEMP/jp100-data.tar"
          else
            echo "data branch does not exist yet; starting with local history."
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Restore market data cache
        uses: actions/cache@v4
        with:
          path: data/raw
          key: jp100-raw-v1-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            jp100-raw-v1-${{ runner.os }}-

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run daily update
        id: pipeline
        shell: bash
        run: |
          set -uo pipefail
          status_path="$RUNNER_TEMP/cloud-status.json"
          args=(
            --yahoo-pages 3
            --daily-count 5
            --status-path "$status_path"
          )
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]] &&
             [[ "${{ inputs.force }}" == "true" ]]; then
            args+=(--force)
          fi

          set +e
          python cloud_job.py "${args[@]}" 2>&1 | tee "$RUNNER_TEMP/cloud-job.log"
          exit_code=${PIPESTATUS[0]}
          set -e

          status=$(python -c \
            'import json,sys; print(json.load(open(sys.argv[1], encoding="utf-8")).get("status", "failed"))' \
            "$status_path")
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit "$exit_code"

      - name: Prepare published data
        if: steps.pipeline.outputs.status == 'completed'
        run: |
          python scripts/export_cloud_data.py \
            --source-data data \
            --target "$RUNNER_TEMP/data-export"

      - name: Publish data branch
        if: steps.pipeline.outputs.status == 'completed'
        shell: bash
        run: |
          set -euo pipefail
          export_dir="$RUNNER_TEMP/data-export"
          index_file="$RUNNER_TEMP/data-branch.index"
          status_path="$RUNNER_TEMP/cloud-status.json"
          trade_date=$(python -c \
            'import json,sys; print(json.load(open(sys.argv[1], encoding="utf-8"))["trade_date"])' \
            "$status_path")

          git fetch origin data:refs/remotes/origin/data 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          export GIT_INDEX_FILE="$index_file"
          rm -f "$GIT_INDEX_FILE"
          git read-tree --empty
          git --work-tree="$export_dir" add -A
          tree=$(git write-tree)

          if git rev-parse --verify refs/remotes/origin/data >/dev/null 2>&1; then
            parent=$(git rev-parse refs/remotes/origin/data)
            commit=$(printf '%s\n' "Automated data update: $trade_date" |
              git commit-tree "$tree" -p "$parent")
          else
            commit=$(printf '%s\n' "Automated data update: $trade_date" |
              git commit-tree "$tree")
          fi

          git push origin "$commit:refs/heads/data"

      - name: Upload run artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jp100-daily-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/cloud-status.json
            ${{ runner.temp }}/cloud-job.log
            data/processed
          if-no-files-found: warn
          retention-days: 14
